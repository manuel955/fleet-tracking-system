name: fleet_passenger_app
description: App del pasajero - pide viajes y seguimiento en vivo del conductor asignado
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  google_maps_flutter: ^2.9.0
  google_maps_flutter_android: ^2.14.10
  google_maps_flutter_platform_interface: ^2.9.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
