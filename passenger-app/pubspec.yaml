name: fleet_passenger_app
description: App del pasajero - pide viajes y seguimiento en vivo del conductor asignado
publish_to: "none"
version: 1.0.0+45

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.1
  mapbox_maps_flutter: 2.25.0
  image_picker: ^1.1.2
  mobile_scanner: ^5.2.3
  url_launcher: ^6.3.0
  package_info_plus: ^10.2.1
  firebase_core: ^4.12.1
  firebase_auth: ^6.2.0
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/apl-mark.png
    - assets/vehicles/vehicle-car.png
    - assets/vehicles/vehicle-car-v2.png
    - assets/vehicles/vehicle-car-new.png
    - assets/vehicles/vehicle-suv.png
    - assets/vehicles/vehicle-minivan.png
    - assets/vehicles/vehicle-van.png
    - assets/vehicles/vehicle-van-v2.png
    - assets/vehicles/vehicle-minibus.png
    - assets/vehicles/vehicle-bus.png
    - assets/vehicles/vehicle-bus-coach.png
    - assets/vehicles/vehicle-bus-dispo.png
    - assets/vehicles/vehicle-bus-v2.png
    - assets/vehicles/vehicle-pickup-v2.png

# Mantiene compileSdk 35, compatible con Mapbox Maps SDK 2.25 y los plugins
# nativos existentes de esta app.
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24
