name: Build signed driver AAB

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Android version code
        required: true
        default: '56'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
      ANDROID_DRIVER_UPLOAD_CERT_SHA1: 70:F3:02:09:6D:1F:87:43:A2:15:B2:EB:B8:F4:30:41:EE:55:D5:A7
      FLEET_KEYSTORE_PATH: /home/runner/.android/fleet-signing.keystore
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
      MAPBOX_STYLE_URI: ${{ secrets.MAPBOX_STYLE_URI }}
      VPS_API_BASE_URL: https://api.tucomprass.com

    steps:
      - uses: actions/checkout@v7

      - name: Restore Android signing key
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          KEYSTORE_BASE64="$ANDROID_RELEASE_KEYSTORE_BASE64"
          printf 'FLEET_KEYSTORE_PASSWORD=%s\n' "$ANDROID_RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'FLEET_KEY_ALIAS=%s\n' "$ANDROID_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'FLEET_KEY_PASSWORD=%s\n' "$ANDROID_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$FLEET_KEYSTORE_PATH")"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$FLEET_KEYSTORE_PATH"

      - name: Verify signing certificate
        run: |
          test -n "$ANDROID_RELEASE_CERT_SHA256"
          KEYTOOL_OUTPUT=$(keytool -list -v -keystore "$FLEET_KEYSTORE_PATH" \
            -storepass "$FLEET_KEYSTORE_PASSWORD" -alias "$FLEET_KEY_ALIAS")
          ACTUAL_SHA1=$(printf '%s\n' "$KEYTOOL_OUTPUT" | sed -n 's/.*SHA1: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          ACTUAL_SHA256=$(printf '%s\n' "$KEYTOOL_OUTPUT" | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED_SHA1=$(echo "$ANDROID_DRIVER_UPLOAD_CERT_SHA1" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$ACTUAL_SHA256"
          EXPECTED_SHA256=$(echo "$ANDROID_RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          echo "Certificado release verificado (SHA1/SHA256): $ACTUAL_SHA1 / $ACTUAL_SHA256"

      - name: Restore Firebase Android configuration
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > driver-app/android/app/google-services.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache Gradle and pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: ${{ runner.os }}-driver-release-${{ hashFiles('driver-app/pubspec.lock', 'driver-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-driver-release-

      - name: Prepare Flutter dependencies
        working-directory: driver-app
        run: flutter pub get

      - name: Build signed Android App Bundle
        working-directory: driver-app
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
            -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false
        run: |
          test -n "$MAPBOX_ACCESS_TOKEN"
          AAB_PATH="$PWD/build/app/outputs/bundle/release/app-release.aab"
          BUILD_LOG="$RUNNER_TEMP/driver-aab-build.log"
          rm -f "$AAB_PATH" "$BUILD_LOG"
          set +e
          timeout --foreground --kill-after=30s 30m flutter build appbundle --release --no-pub \
            --build-number "${{ inputs.build_number }}" \
            --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
            --dart-define=MAPBOX_STYLE_URI="${MAPBOX_STYLE_URI:-mapbox://styles/mapbox/standard}" \
            --dart-define=VPS_API_BASE_URL="$VPS_API_BASE_URL" \
            2>&1 | tee "$BUILD_LOG"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ] || [ ! -s "$AAB_PATH" ]; then
            echo "La compilacion del AAB fallo. Ultimas lineas del log:"
            tail -n 200 "$BUILD_LOG"
            exit 1
          fi
          unzip -t "$AAB_PATH" >/dev/null
          echo "AAB valido generado: $AAB_PATH"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v7
        with:
          name: apl-conductores-v1.0.1-${{ inputs.build_number }}-signed
          path: driver-app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
