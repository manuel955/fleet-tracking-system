name: Build branded fleet app

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to build (driver or passenger)
        required: true
        type: choice
        options: [driver, passenger]
      request_id:
        description: One-time build request identifier
        required: true
        type: string
      build_token:
        description: One-time build request token
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CALLBACK_BASE: https://us-central1-rastreoflota-53052.cloudfunctions.net
      APP_KIND: ${{ inputs.app }}
      REQUEST_ID: ${{ inputs.request_id }}
      BUILD_TOKEN: ${{ inputs.build_token }}
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
      ANDROID_DRIVER_UPLOAD_CERT_SHA1: 70:F3:02:09:6D:1F:87:43:A2:15:B2:EB:B8:F4:30:41:EE:55:D5:A7
      FLEET_KEYSTORE_PATH: /home/runner/.android/fleet-signing.keystore
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      PASSENGER_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.PASSENGER_GOOGLE_SERVICES_JSON_BASE64 }}
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
      MAPBOX_STYLE_URI: ${{ secrets.MAPBOX_STYLE_URI }}
      VPS_API_BASE_URL: https://api.tucomprass.com
    steps:
      - uses: actions/checkout@v7

      - name: Read signed build request
        run: |
          curl --fail --silent --show-error \
            "$CALLBACK_BASE/getAppBrandingBuild?requestId=$REQUEST_ID&token=$BUILD_TOKEN" \
            -o build-request.json

      - name: Install icon converter
        run: python3 -m pip install --quiet Pillow

      - name: Apply app name, icon and build number
        run: |
          python3 - <<'PY'
          import json, os, re, shutil, urllib.request
          from PIL import Image
          from pathlib import Path
          from xml.sax.saxutils import escape

          request = json.loads(Path('build-request.json').read_text())
          app_dir = {'driver': 'driver-app', 'passenger': 'passenger-app'}[request['app']]
          root = Path(app_dir)
          pubspec = root / 'pubspec.yaml'
          version_name = request['versionName']
          pubspec.write_text(re.sub(r'^version:.*$', f"version: {version_name}+{request['build']}", pubspec.read_text(), flags=re.M))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as github_env:
              github_env.write(f"BUILD_NUMBER={request['build']}\n")
              github_env.write(f"VERSION_NAME={version_name}\n")

          values = root / 'android/app/src/main/res/values'
          (values / 'app_name.xml').write_text(
              '<resources>\n    <string name="app_name">' + escape(request['name']) + '</string>\n</resources>\n'
          )

          if request.get('iconUrl'):
              icon = root / 'android/app/src/main/res/drawable/app_branding_icon.png'
              # El icono puede haberse subido como JPG, WebP o PNG. Android
              # exige que la extension y el contenido coincidan, por eso se
              # descarga primero sin extension y se convierte a PNG real.
              source_icon = root / 'app_branding_source'
              urllib.request.urlretrieve(request['iconUrl'], source_icon)
              with Image.open(source_icon) as uploaded_icon:
                  uploaded_icon.convert('RGBA').save(icon, 'PNG')
              source_icon.unlink(missing_ok=True)
              manifest = root / 'android/app/src/main/AndroidManifest.xml'
              manifest.write_text(re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/app_branding_icon"', manifest.read_text(), count=1))
          PY

      - name: Restore the existing Android signing key
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          KEYSTORE_BASE64="$ANDROID_RELEASE_KEYSTORE_BASE64"
          printf 'FLEET_KEYSTORE_PASSWORD=%s\n' "$ANDROID_RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'FLEET_KEY_ALIAS=%s\n' "$ANDROID_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'FLEET_KEY_PASSWORD=%s\n' "$ANDROID_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$FLEET_KEYSTORE_PATH")"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$FLEET_KEYSTORE_PATH"

      - name: Verify signing certificate
        run: |
          test -n "$ANDROID_RELEASE_CERT_SHA256"
          KEYTOOL_OUTPUT=$(keytool -list -v -keystore "$FLEET_KEYSTORE_PATH" \
            -storepass "$FLEET_KEYSTORE_PASSWORD" -alias "$FLEET_KEY_ALIAS")
          ACTUAL_SHA1=$(printf '%s\n' "$KEYTOOL_OUTPUT" | sed -n 's/.*SHA1: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          ACTUAL_SHA256=$(printf '%s\n' "$KEYTOOL_OUTPUT" | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$ACTUAL_SHA256"
          EXPECTED_SHA256=$(echo "$ANDROID_RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          if [ "$APP_KIND" = "driver" ]; then
            EXPECTED_SHA1=$(echo "$ANDROID_DRIVER_UPLOAD_CERT_SHA1" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"
          fi
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          echo "Certificado release verificado (SHA1/SHA256): $ACTUAL_SHA1 / $ACTUAL_SHA256"

      - name: Restore Firebase Android configuration
        run: |
          if [ "$APP_KIND" = "passenger" ]; then
            FIREBASE_JSON="$PASSENGER_GOOGLE_SERVICES_JSON_BASE64"
          else
            FIREBASE_JSON="$GOOGLE_SERVICES_JSON_BASE64"
          fi
          if [ -z "$FIREBASE_JSON" ]; then
            echo "Falta la configuracion privada de Firebase para Android"
            exit 1
          fi
          echo "$FIREBASE_JSON" | base64 --decode > "$APP_KIND-app/android/app/google-services.json"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache Flutter and Android build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ inputs.app }}-app/.dart_tool
            ${{ inputs.app }}-app/build
          key: ${{ runner.os }}-${{ inputs.app }}-flutter-${{ hashFiles(format('{0}-app/pubspec.lock', inputs.app), format('{0}-app/android/**', inputs.app)) }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.app }}-flutter-

      - name: Prepare Flutter dependencies
        working-directory: ${{ inputs.app == 'driver' && 'driver-app' || 'passenger-app' }}
        run: flutter pub get

      - name: Build Android release APK
        working-directory: ${{ inputs.app == 'driver' && 'driver-app' || 'passenger-app' }}
        run: |
          if [ -z "$MAPBOX_ACCESS_TOKEN" ]; then
            echo "Falta MAPBOX_ACCESS_TOKEN; se cancela la publicación para no entregar una app sin mapas."
            exit 1
          fi
          # Gradle/Mapbox puede pasar varios minutos sin escribir en stdout
          # durante la primera compilacion fria. El pulso evita que GitHub
          # marque el job como inactivo y lo cancele antes de terminar.
          heartbeat() {
            while true; do
              echo "Compilando APK $APP_KIND... $(date -u +%H:%M:%S) UTC"
              sleep 30
            done
          }
          kill_tree() {
            local pid="$1"
            [ -z "$pid" ] && return 0
            for child in $(pgrep -P "$pid" 2>/dev/null || true); do
              kill_tree "$child"
            done
            kill "$pid" 2>/dev/null || true
          }
          heartbeat &
          HEARTBEAT_PID=$!
          BUILD_PID=""
          trap 'kill_tree "$BUILD_PID"; kill "$HEARTBEAT_PID" 2>/dev/null || true' EXIT
          # El runner puede dejar activo el VFS watcher de Gradle al compilar
          # plugins nativos (Mapbox/CMake). Desactivarlo evita el bloqueo
          # "Already watching path" que dejaba assembleRelease esperando.
          export GRADLE_OPTS="${GRADLE_OPTS:-} -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false"
          APK_PATH="$PWD/build/app/outputs/flutter-apk/app-release.apk"
          BUILD_LOG="$RUNNER_TEMP/${APP_KIND}-flutter-build.log"
          rm -f "$APK_PATH" "$BUILD_LOG"
          flutter build apk --release --no-pub \
            --build-name "$VERSION_NAME" \
            --build-number "$BUILD_NUMBER" \
            --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
            --dart-define=MAPBOX_STYLE_URI="${MAPBOX_STYLE_URI:-mapbox://styles/mapbox/standard}" \
            --dart-define=VPS_API_BASE_URL="$VPS_API_BASE_URL" \
            >"$BUILD_LOG" 2>&1 &
          BUILD_PID=$!
          BUILD_STATUS=0
          APK_READY=false
          while kill -0 "$BUILD_PID" 2>/dev/null; do
            if [ -s "$APK_PATH" ] && unzip -t "$APK_PATH" >/dev/null 2>&1; then
              APK_READY=true
              echo "APK valida generada; cerrando el watcher de Gradle para continuar."
              break
            fi
            sleep 15
          done
          if [ "$APK_READY" = true ]; then
            kill_tree "$BUILD_PID"
            BUILD_PID=""
          else
            wait "$BUILD_PID" || BUILD_STATUS=$?
            BUILD_PID=""
            if [ "$BUILD_STATUS" -ne 0 ] || [ ! -s "$APK_PATH" ]; then
              echo "La compilación de Android falló. Últimas líneas del log:"
              tail -n 200 "$BUILD_LOG"
              exit 1
            fi
          fi

      - name: Build Android App Bundle
        working-directory: ${{ inputs.app == 'driver' && 'driver-app' || 'passenger-app' }}
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false
        run: |
          flutter build appbundle --release --no-pub \
            --build-name "$VERSION_NAME" \
            --build-number "$BUILD_NUMBER" \
            --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
            --dart-define=MAPBOX_STYLE_URI="${MAPBOX_STYLE_URI:-mapbox://styles/mapbox/standard}" \
            --dart-define=VPS_API_BASE_URL="$VPS_API_BASE_URL"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: apl-${{ inputs.app }}-${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}-signed
          path: |
            ${{ inputs.app }}-app/build/app/outputs/flutter-apk/app-release.apk
            ${{ inputs.app }}-app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK through one-time signed URL
        run: |
          UPLOAD_URL=$(python3 -c "import json; print(json.load(open('build-request.json'))['uploadUrl'])")
          APK_PATH="${APP_KIND}-app/build/app/outputs/flutter-apk/app-release.apk"
          curl --fail --silent --show-error --upload-file "$APK_PATH" \
            -H 'Content-Type: application/vnd.android.package-archive' "$UPLOAD_URL"

      - name: Publish the new build
        run: |
          curl --fail --silent --show-error -X POST "$CALLBACK_BASE/completeAppBrandingBuild" \
            -H 'Content-Type: application/json' \
            --data "{\"requestId\":\"$REQUEST_ID\",\"token\":\"$BUILD_TOKEN\"}"
